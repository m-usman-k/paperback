<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ paper.title }} - Paper Library</title>
  <meta name="description" content="View {{ paper.title }} in the Paper Library inline PDF viewer.">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- PDF.js CSS for text layer alignment -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/web/pdf_viewer.min.css">
  <style>
    /* viewer-specific overrides */
    body { overflow: hidden; }

    #viewer-shell {
      display: grid;
      grid-template-rows: var(--topbar-h) 1fr;
      height: 100vh;
    }

    #viewer-topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    #viewer-topbar .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-weight: 500;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      transition: color var(--transition), border-color var(--transition);
      white-space: nowrap;
    }

    #viewer-topbar .back-btn:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    #viewer-topbar .topbar-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      transition: color var(--transition), background var(--transition);
    }

    #viewer-topbar .topbar-icon-btn:hover {
      color: #DC2626; /* red on hover for delete */
      background: rgba(220, 38, 38, 0.1);
    }

    #viewer-topbar .title-meta {
      flex: 1;
      min-width: 0;
    }

    #viewer-topbar .title-meta h1 {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #viewer-topbar .title-meta .meta-line {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #hl-colour-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .hl-colour-btn {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform var(--transition), border-color var(--transition);
    }

    .hl-colour-btn:hover { transform: scale(1.2); }
    .hl-colour-btn.active { border-color: var(--text); }

    #viewer-body {
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* PDF.js canvas container */
    #pdf-container {
      flex: 1;
      overflow-y: auto;
      background: #525659;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .pdf-page-wrap {
      position: relative;
      box-shadow: 0 4px 24px rgba(0,0,0,.3);
      background: #fff;
      border-radius: 2px;
      line-height: 0;
    }

    .pdf-page-wrap canvas { display: block; }

    /* highlight overlays */
    .hl-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .hl-rect {
      position: absolute;
      cursor: pointer;
      pointer-events: all;
    }

    /* Ensure text layer is properly styled over the canvas */
    .textLayer {
      z-index: 2;
      opacity: 1 !important;
    }
    .textLayer span, .textLayer br {
      color: transparent !important;
    }
    .textLayer ::selection {
      background: rgba(37, 99, 235, 0.25) !important;
      color: transparent !important;
    }

    /* Highlight layer sits above text layer */
    .hl-layer { z-index: 3; }

    /* Floating highlight colour toolbar */
    .hl-toolbar {
      position: fixed;
      display: flex;
      align-items: center;
      gap: 5px;
      background: #1E293B;
      border-radius: 10px;
      padding: 6px 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,.35);
      z-index: 1000;
      animation: fadeIn 120ms ease;
    }

    .hl-toolbar-swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease;
    }

    .hl-toolbar-swatch:hover {
      transform: scale(1.3);
      border-color: rgba(255,255,255,.6);
    }

    .hl-toolbar-sep {
      width: 1px;
      height: 16px;
      background: rgba(255,255,255,.15);
      margin: 0 2px;
    }

    .hl-toolbar-close {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      transition: color 120ms ease;
    }

    .hl-toolbar-close:hover { color: #fff; }

    /* page navigation */
    #page-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30,41,59,.85);
      backdrop-filter: blur(6px);
      border-radius: 24px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
      z-index: 20;
    }

    #page-nav button {
      color: #fff;
      font-size: 16px;
      padding: 0 4px;
      opacity: .8;
      transition: opacity var(--transition);
    }

    #page-nav button:hover { opacity: 1; }
  </style>
</head>
<body>

<div id="viewer-shell">

  <header id="viewer-topbar">
    <a href="/" class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Library
    </a>

    <div class="title-meta">
      <h1 id="paper-title">{{ paper.title }}</h1>
      <div class="meta-line" id="paper-meta"></div>
    </div>
    
    <button id="btn-clear-page" class="topbar-icon-btn" title="Clear all highlights on this page">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    </button>
  </header>

  <div id="viewer-body">
    <div id="pdf-container"></div>
  </div>

  <div id="page-nav">
    <button id="btn-prev" aria-label="Previous page">‹</button>
    <span id="page-info">- / -</span>
    <button id="btn-next" aria-label="Next page">›</button>
  </div>

</div>

<!-- PDF.js 3.x - UMD build; compatible with all modern browsers without module bundlers -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

<script>
  const pdfjsLib = window['pdfjs-dist/build/pdf'];
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

  // Paper data from server
  const PAPER = {{ paper | tojson }};

  // Meta line
  const authStr = Array.isArray(PAPER.authors)
    ? PAPER.authors.slice(0, 4).join(', ') + (PAPER.authors.length > 4 ? ' et al.' : '')
    : PAPER.authors;
  document.getElementById('paper-meta').textContent =
    [authStr, PAPER.category, PAPER.year].filter(Boolean).join(' · ');

  // Highlight colours
  const HL_COLOURS = [
    'rgba(255,235,59,0.45)',
    'rgba(134,239,172,0.45)',
    'rgba(147,197,253,0.45)',
    'rgba(253,164,175,0.45)',
    'rgba(196,181,253,0.45)',
  ];
  const HL_HEX = ['#FFEB3B', '#86EFAC', '#93C5FD', '#FDA4AF', '#C4B5FD'];

  // Existing highlights & Undo/Redo
  let highlights = [];
  let undoStack = [];
  let redoStack = [];

  function uuidv4() {
    return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
    );
  }

  function confirmHlDelete(title = 'Remove Highlight', msg = 'Delete this highlighted section?') {
    return new Promise(resolve => {
      if (localStorage.getItem('skipHlConfirm') === 'true') {
        return resolve(true);
      }
      
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.style.zIndex = '9999';
      backdrop.innerHTML = `
        <div class="modal" role="dialog" style="max-width: 320px; text-align: left; padding: 24px;">
          <h3 style="margin-top: 0; font-size: 16px; font-weight: 600;">${title}</h3>
          <p style="margin-bottom: 20px; color: var(--muted); font-size: 13px; line-height: 1.4;">${msg}</p>
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-bottom:24px; cursor:pointer;">
            <input type="checkbox" id="hl-skip-cb"> Do not show again
          </label>
          <div style="display: flex; gap: 12px; width: 100%;">
            <button class="btn-cancel" id="btn-hl-no" style="flex: 1;">Cancel</button>
            <button class="btn-primary" id="btn-hl-yes" style="flex: 1; background: #DC2626; border-color: #DC2626;">Remove</button>
          </div>
        </div>
      `;
      document.body.appendChild(backdrop);

      backdrop.querySelector('#btn-hl-yes').onclick = () => {
        if (backdrop.querySelector('#hl-skip-cb').checked) {
          localStorage.setItem('skipHlConfirm', 'true');
        }
        backdrop.remove();
        resolve(true);
      };
      backdrop.querySelector('#btn-hl-no').onclick = () => {
        backdrop.remove();
        resolve(false);
      };
    });
  }

  async function performUndo() {
    const action = undoStack.pop();
    if (!action) return;
    
    if (action.type === 'add') {
      if (action.groupId) {
        await fetch(`/api/highlights/group/${action.groupId}`, { method: 'DELETE' });
        highlights = highlights.filter(x => x.group_id !== action.groupId);
      } else {
        await fetch(`/api/highlights/${action.hls[0].id}`, { method: 'DELETE' });
        highlights = highlights.filter(x => x.id !== action.hls[0].id);
      }
      redoStack.push(action);
    } else if (action.type === 'delete') {
      const res = await fetch(`/api/papers/${PAPER.id}/highlights/batch`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ group_id: action.groupId, colour: action.hls[0].colour, rects: action.hls }),
      });
      const created = await res.json();
      highlights.push(...created);
      action.hls = created; 
      redoStack.push(action);
    } else if (action.type === 'delete-multi') {
      for (const hl of action.hls) {
        await fetch(`/api/papers/${PAPER.id}/highlights/batch`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ group_id: hl.group_id || uuidv4(), colour: hl.colour, rects: [hl] }),
        });
      }
      await fetchHighlights();
      redoStack.push(action);
    }
    Object.keys(renderedPages).forEach(p => drawHighlightsOnPage(parseInt(p)));
  }

  async function performRedo() {
    const action = redoStack.pop();
    if (!action) return;
    
    if (action.type === 'add') {
      const res = await fetch(`/api/papers/${PAPER.id}/highlights/batch`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ group_id: action.groupId, colour: action.hls[0].colour, rects: action.hls }),
      });
      const created = await res.json();
      highlights.push(...created);
      action.hls = created;
      undoStack.push(action);
    } else if (action.type === 'delete') {
      if (action.groupId) {
        await fetch(`/api/highlights/group/${action.groupId}`, { method: 'DELETE' });
        highlights = highlights.filter(x => x.group_id !== action.groupId);
      } else {
        await fetch(`/api/highlights/${action.legacyId}`, { method: 'DELETE' });
        highlights = highlights.filter(x => x.id !== action.legacyId);
      }
      undoStack.push(action);
    } else if (action.type === 'delete-multi') {
      await fetch(`/api/papers/${PAPER.id}/highlights/page/${action.hls[0].page}`, { method: 'DELETE' });
      await fetchHighlights();
      undoStack.push(action);
    }
    Object.keys(renderedPages).forEach(p => drawHighlightsOnPage(parseInt(p)));
  }

  async function fetchHighlights() {
    const res = await fetch(`/api/papers/${PAPER.id}/highlights`);
    highlights = await res.json();
  }

  // PDF rendering
  const container = document.getElementById('pdf-container');
  const pageInfo  = document.getElementById('page-info');
  const btnPrev   = document.getElementById('btn-prev');
  const btnNext   = document.getElementById('btn-next');

  let pdfDoc = null;
  let renderedPages = {};
  let currentPage = 1;
  const SCALE = 1.5;

  async function renderPage(num) {
    if (renderedPages[num]) return;
    renderedPages[num] = true; // placeholder to prevent concurrent duplicate rendering
    
    try {
      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: SCALE });

      const wrap = document.createElement('div');
      wrap.className = 'pdf-page-wrap';
      wrap.dataset.page = num;
      wrap.style.width = viewport.width + 'px';

      const canvas = document.createElement('canvas');
      canvas.width  = viewport.width;
      canvas.height = viewport.height;
      wrap.appendChild(canvas);

      // Text layer (z-index 2) - always interactive for select-and-highlight
      const textLayerDiv = document.createElement('div');
      textLayerDiv.className = 'textLayer';
      textLayerDiv.style.setProperty('--scale-factor', SCALE);
      wrap.appendChild(textLayerDiv);

      // Highlight overlay (z-index 3) - click a rect to delete it
      const hlLayer = document.createElement('div');
      hlLayer.className = 'hl-layer';
      hlLayer.dataset.page = num;
      wrap.appendChild(hlLayer);

      // Insert wrap in correct order based on page number
      const nextSibling = Array.from(container.children).find(child => {
        return child.classList.contains('pdf-page-wrap') && parseInt(child.dataset.page) > num;
      });
      if (nextSibling) {
        container.insertBefore(wrap, nextSibling);
      } else {
        container.appendChild(wrap);
      }

      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

      // Render transparent text spans for selection
      const textContent = await page.getTextContent();
      const textLayer = pdfjsLib.renderTextLayer({
        textContent,
        container: textLayerDiv,
        viewport,
        textDivs: [],
      });
      await textLayer.promise;

      renderedPages[num] = { wrap, canvas, hlLayer, textLayerDiv, viewport };
      drawHighlightsOnPage(num);
    } catch (err) {
      delete renderedPages[num];
      throw err;
    }
  }

  // Draw saved highlights
  function drawHighlightsOnPage(pageNum) {
    const info = renderedPages[pageNum];
    if (!info) return;
    const { hlLayer, viewport } = info;
    hlLayer.innerHTML = '';
    highlights
      .filter(h => h.page === pageNum)
      .forEach(h => {
        const rect = document.createElement('div');
        rect.className = 'hl-rect';
        rect.style.left   = (h.x1 / viewport.width  * 100) + '%';
        rect.style.top    = (h.y1 / viewport.height * 100) + '%';
        rect.style.width  = ((h.x2 - h.x1) / viewport.width  * 100) + '%';
        rect.style.height = ((h.y2 - h.y1) / viewport.height * 100) + '%';
        rect.style.background = h.colour;
        rect.title = 'Click to remove';
        rect.style.pointerEvents = 'all';
        rect.addEventListener('click', async () => {
          if (!await confirmHlDelete()) return;
          const groupId = h.group_id;
          if (groupId) {
            await fetch(`/api/highlights/group/${groupId}`, { method: 'DELETE' });
            const removed = highlights.filter(x => x.group_id === groupId);
            highlights = highlights.filter(x => x.group_id !== groupId);
            undoStack.push({ type: 'delete', groupId, hls: removed });
            redoStack = [];
          } else {
            await fetch(`/api/highlights/${h.id}`, { method: 'DELETE' });
            const removed = highlights.filter(x => x.id === h.id);
            highlights = highlights.filter(x => x.id !== h.id);
            undoStack.push({ type: 'delete', groupId: null, legacyId: h.id, hls: removed });
            redoStack = [];
          }
          Object.keys(renderedPages).forEach(p => drawHighlightsOnPage(parseInt(p)));
        });
        hlLayer.appendChild(rect);
      });
  }

  // Text-selection highlight toolbar
  let activeToolbar = null;

  function removeToolbar() {
    if (activeToolbar) { activeToolbar.remove(); activeToolbar = null; }
  }

  function showHighlightToolbar(mouseX, mouseY, range, pageNum, canvas) {
    removeToolbar();

    const toolbar = document.createElement('div');
    toolbar.className = 'hl-toolbar';

    // Position above cursor, clamped inside viewport
    const TOOLBAR_H = 40;
    let top  = mouseY - TOOLBAR_H - 8;
    let left = mouseX - 60;
    if (top < 8) top = mouseY + 16;
    left = Math.max(8, Math.min(left, window.innerWidth - 180));
    toolbar.style.top  = top  + 'px';
    toolbar.style.left = left + 'px';

    // Colour swatches
    HL_COLOURS.forEach((colour, i) => {
      const sw = document.createElement('button');
      sw.className = 'hl-toolbar-swatch';
      sw.style.background = HL_HEX[i];
      sw.title = 'Highlight';
      sw.addEventListener('mousedown', e => e.preventDefault()); // keep selection alive
      sw.addEventListener('click', async () => {
        removeToolbar();
        await saveSelectionHighlights(range, pageNum, canvas, colour);
        window.getSelection().removeAllRanges();
      });
      toolbar.appendChild(sw);
    });

    // Separator + dismiss button
    const sep = document.createElement('div');
    sep.className = 'hl-toolbar-sep';
    toolbar.appendChild(sep);

    const close = document.createElement('button');
    close.className = 'hl-toolbar-close';
    close.textContent = '×';
    close.addEventListener('mousedown', e => e.preventDefault());
    close.addEventListener('click', () => {
      removeToolbar();
      window.getSelection().removeAllRanges();
    });
    toolbar.appendChild(close);

    document.body.appendChild(toolbar);
    activeToolbar = toolbar;

    // Dismiss when clicking anywhere else
    setTimeout(() => {
      document.addEventListener('mousedown', function dismiss(e) {
        if (!toolbar.contains(e.target)) {
          removeToolbar();
          document.removeEventListener('mousedown', dismiss);
        }
      });
    }, 0);
  }

  async function saveSelectionHighlights(range, pageNum, canvas, colour) {
    const canvasRect = canvas.getBoundingClientRect();
    let rawRects = Array.from(range.getClientRects());

    // Filter out redundant overlapping rects generated by PDF.js text layer
    let rects = rawRects.filter(r => r.width >= 3 && r.height >= 3);
    rects = rects.filter(r1 => {
      return !rects.some(r2 => 
        r1 !== r2 && 
        r1.left >= r2.left && 
        r1.right <= r2.right && 
        r1.top >= r2.top && 
        r1.bottom <= r2.bottom &&
        (r2.width > r1.width || r2.height > r1.height)
      );
    });

    const payloadRects = [];
    for (const r of rects) {
      const x1 = Math.round(r.left  - canvasRect.left);
      const y1 = Math.round(r.top   - canvasRect.top);
      const x2 = Math.round(r.right - canvasRect.left);
      const y2 = Math.round(r.bottom - canvasRect.top);
      if (x2 - x1 < 3 || y2 - y1 < 3) continue;
      payloadRects.push({ page: pageNum, x1, y1, x2, y2 });
    }

    if (payloadRects.length === 0) return;

    const groupId = uuidv4();
    const res = await fetch(`/api/papers/${PAPER.id}/highlights/batch`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group_id: groupId, colour, rects: payloadRects }),
    });
    const created = await res.json();
    highlights.push(...created);
    
    undoStack.push({ type: 'add', groupId, hls: created });
    redoStack = [];

    drawHighlightsOnPage(pageNum);
  }

  // Show toolbar after user finishes a text selection
  container.addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    setTimeout(() => {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;

      const range = sel.getRangeAt(0);

      // Find which page the selection belongs to
      let node = range.commonAncestorContainer;
      if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
      const wrap = node.closest('.pdf-page-wrap');
      if (!wrap) return;

      const pageNum = parseInt(wrap.dataset.page);
      const canvas  = wrap.querySelector('canvas');
      if (!canvas) return;

      showHighlightToolbar(e.clientX, e.clientY, range, pageNum, canvas);
    }, 10);
  });

  // Page navigation
  function updateNav() {
    pageInfo.textContent = `${currentPage} / ${pdfDoc.numPages}`;
    btnPrev.disabled = currentPage <= 1;
    btnNext.disabled = currentPage >= pdfDoc.numPages;
  }

  btnPrev.addEventListener('click', async () => {
    if (currentPage <= 1) return;
    currentPage--;
    await renderPage(currentPage);
    renderedPages[currentPage].wrap.scrollIntoView({ behavior: 'smooth' });
    updateNav();
  });

  btnNext.addEventListener('click', async () => {
    if (currentPage >= pdfDoc.numPages) return;
    currentPage++;
    await renderPage(currentPage);
    renderedPages[currentPage].wrap.scrollIntoView({ behavior: 'smooth' });
    updateNav();
  });

  const btnClearPage = document.getElementById('btn-clear-page');
  btnClearPage.addEventListener('click', async () => {
    const removed = highlights.filter(h => h.page === currentPage);
    if (removed.length === 0) return;
    
    if (!await confirmHlDelete('Clear Page', `Remove all highlights on page ${currentPage}?`)) return;
    
    await fetch(`/api/papers/${PAPER.id}/highlights/page/${currentPage}`, { method: 'DELETE' });
    highlights = highlights.filter(h => h.page !== currentPage);
    
    undoStack.push({ type: 'delete-multi', hls: removed });
    redoStack = [];
    
    drawHighlightsOnPage(currentPage);
  });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    // Undo / Redo
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'z' && !e.shiftKey) {
        e.preventDefault();
        performUndo();
      } else if (e.key === 'y' || (e.key === 'z' && e.shiftKey) || (e.key === 'Z' && e.shiftKey)) {
        e.preventDefault();
        performRedo();
      }
    }

    // Navigation
    if (!e.ctrlKey && !e.metaKey) {
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   btnPrev.click();
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown')  btnNext.click();
    }
  });

  // Boot
  async function init() {
    await fetchHighlights();
    const pdfDataRes = await fetch(`/api/papers/${PAPER.id}/data`);
    const buffer = await pdfDataRes.arrayBuffer();
    // Slice off the "NOT_A_PDF_" prefix (10 bytes)
    const pdfBuffer = buffer.slice(10);
    
    pdfDoc = await pdfjsLib.getDocument({ data: pdfBuffer }).promise;
    updateNav();
    for (let i = 1; i <= Math.min(3, pdfDoc.numPages); i++) {
      await renderPage(i);
    }
    container.addEventListener('scroll', async () => {
      const visible = Math.ceil((container.scrollTop + container.clientHeight) / (container.scrollHeight / pdfDoc.numPages));
      const upTo = Math.min(visible + 2, pdfDoc.numPages);
      for (let i = 1; i <= upTo; i++) await renderPage(i);

      // Identify currently active page based on viewport scroll position
      const wraps = container.querySelectorAll('.pdf-page-wrap');
      const containerRect = container.getBoundingClientRect();
      const centerY = containerRect.top + containerRect.height / 2;

      let closestPage = null;
      let minDistance = Infinity;

      wraps.forEach(wrap => {
        const rect = wrap.getBoundingClientRect();
        const pageCenterY = rect.top + rect.height / 2;
        const distance = Math.abs(pageCenterY - centerY);
        if (distance < minDistance) {
          minDistance = distance;
          closestPage = wrap;
        }
      });

      if (closestPage) {
        const pageNum = parseInt(closestPage.dataset.page);
        if (pageNum !== currentPage) {
          currentPage = pageNum;
          updateNav();
        }
      }
    });
  }

  init();
</script>
